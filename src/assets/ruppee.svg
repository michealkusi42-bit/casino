<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <clipPath id="circle">
      <circle cx="50" cy="50" r="50"/>
    </clipPath>
  </defs>
  <!-- Ghana flag stripes in circle -->
  <rect x="0" y="0" width="100" height="33" fill="#006B3F" clip-path="url(#circle)"/>
  <rect x="0" y="33" width="100" height="34" fill="#FCD116" clip-path="url(#circle)"/>
  <rect x="0" y="67" width="100" height="33" fill="#CE1126" clip-path="url(#circle)"/>
  <!-- Black star -->
  <polygon points="50,20 54,35 68,35 57,44 61,58 50,49 39,58 43,44 32,35 46,35" fill="#000000" clip-path="url(#circle)"/>
  <!-- Ghana Cedis symbol -->
  <text x="50" y="72" font-size="30" font-family="Arial" font-weight="bold" fill="white" text-anchor="middle">₵</text>
</svg>
