<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f2e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="curve" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e676"/>
      <stop offset="100%" style="stop-color:#00bcd4"/>
    </linearGradient>
    <radialGradient id="rocketGlow" cx="70%" cy="25%" r="30%">
      <stop offset="0%" style="stop-color:#00e676;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00e676;stop-opacity:0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round">
      <rect width="300" height="300" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="300" height="300" fill="url(#bg)"/>

    <!-- Purple/dark overlay -->
    <rect width="300" height="300" fill="rgba(80,0,120,0.15)"/>

    <!-- Stars scattered -->
    <circle cx="20" cy="20" r="1" fill="white" opacity="0.7"/>
    <circle cx="55" cy="12" r="1.5" fill="white" opacity="0.5"/>
    <circle cx="90" cy="30" r="1" fill="white" opacity="0.6"/>
    <circle cx="140" cy="8" r="1.2" fill="white" opacity="0.8"/>
    <circle cx="200" cy="18" r="1" fill="white" opacity="0.5"/>
    <circle cx="240" cy="35" r="1.5" fill="white" opacity="0.6"/>
    <circle cx="270" cy="15" r="1" fill="white" opacity="0.7"/>
    <circle cx="285" cy="50" r="1.2" fill="white" opacity="0.4"/>
    <circle cx="15" cy="70" r="1" fill="white" opacity="0.5"/>
    <circle cx="60" cy="55" r="1.3" fill="white" opacity="0.6"/>
    <circle cx="110" cy="65" r="1" fill="white" opacity="0.4"/>
    <circle cx="175" cy="45" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="225" cy="60" r="1" fill="white" opacity="0.5"/>
    <circle cx="260" cy="80" r="1.2" fill="white" opacity="0.6"/>
    <circle cx="30" cy="110" r="1" fill="white" opacity="0.4"/>
    <circle cx="80" cy="95" r="1.4" fill="white" opacity="0.5"/>

    <!-- Rocket glow behind -->
    <circle cx="215" cy="75" r="50" fill="url(#rocketGlow)" filter="url(#blur)"/>

    <!-- Curve fill area -->
    <path d="M0 300 Q50 295 80 280 Q130 250 170 210 Q210 165 240 110 Q260 75 300 30 L300 300 Z"
      fill="url(#curve)" opacity="0.8"/>

    <!-- Curve line glow (behind) -->
    <path d="M0 300 Q50 295 80 280 Q130 250 170 210 Q210 165 240 110 Q260 75 300 30"
      fill="none" stroke="#00e676" stroke-width="6" stroke-linecap="round" opacity="0.3" filter="url(#blur)"/>

    <!-- Curve line sharp -->
    <path d="M0 300 Q50 295 80 280 Q130 250 170 210 Q210 165 240 110 Q260 75 300 30"
      fill="none" stroke="#00e676" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>

    <!-- Multiplier display box -->
    <rect x="20" y="160" width="160" height="70" rx="10" fill="rgba(0,0,0,0.4)"/>
    <rect x="20" y="160" width="160" height="70" rx="10" fill="none" stroke="rgba(0,230,118,0.2)" stroke-width="1"/>

    <!-- Multiplier text glow -->
    <text x="100" y="205" text-anchor="middle" font-family="'Courier New',monospace"
      font-size="42" font-weight="900" fill="#00e676" opacity="0.3" filter="url(#blur)">3.24x</text>
    <!-- Multiplier text sharp -->
    <text x="100" y="205" text-anchor="middle" font-family="'Courier New',monospace"
      font-size="42" font-weight="900" fill="url(#glow)">3.24x</text>

    <!-- Small label -->
    <text x="100" y="222" text-anchor="middle" font-family="Arial,sans-serif"
      font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="1">MULTIPLIER</text>

    <!-- Rocket -->
    <text x="215" y="95" text-anchor="middle" font-size="50" filter="url(#softglow)">🚀</text>

    <!-- Bottom label bar -->
    <rect x="0" y="255" width="300" height="45" fill="rgba(0,0,0,0.6)"/>
    <rect x="0" y="255" width="300" height="1" fill="rgba(0,230,118,0.3)"/>

    <!-- CRASH text -->
    <text x="150" y="285" text-anchor="middle" font-family="Arial,sans-serif"
      font-size="20" font-weight="900" fill="white" letter-spacing="4">CRASH</text>

    <!-- Green dot indicator -->
    <circle cx="52" cy="279" r="5" fill="#00e676"/>
    <circle cx="52" cy="279" r="3" fill="#00ff88"/>

    <!-- FORETELL tag -->
    <text x="67" y="283" font-family="Arial,sans-serif" font-size="9"
      fill="rgba(255,255,255,0.4)" letter-spacing="1">FORETELL ORIGINAL</text>
  </g>
</svg>
